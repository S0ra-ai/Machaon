name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.8"
      - name: ruff
        run: ruff check machaon tests examples scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install numpy
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: package entry points
        run: |
          python -m machaon --version
          python -m machaon doctor
      - name: demo
        run: python -m machaon.cli demo
      - name: gate must reject a bad edit
        run: |
          if python -m machaon.cli gate examples/metrics_fail.json; then
            echo "gate accepted a failing edit"; exit 1
          else
            echo "gate correctly rejected it"
          fi

  extras:
    name: adapters, runtime, evaluation, coverage
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install numpy safetensors transformers "coverage[toml]"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: full suite with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml
      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
      - name: end-to-end example
        run: python examples/tiny_edit.py

  mcp:
    name: MCP stdio transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[mcp]"
      - name: real client, real stdio transport
        run: python scripts/mcp_smoke.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - name: build docs strictly
        run: mkdocs build --strict

  package:
    name: build and install the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install the wheel and exercise it
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/machaon --version
          /tmp/wheel-test/bin/machaon doctor
          /tmp/wheel-test/bin/python -c "import machaon; print(machaon.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
