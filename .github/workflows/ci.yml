name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check machaon tests examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install numpy
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: demo
        run: python -m machaon.cli demo
      - name: gate must reject a bad edit
        run: |
          if python -m machaon.cli gate examples/metrics_fail.json; then
            echo "gate accepted a failing edit"; exit 1
          else
            echo "gate correctly rejected it"
          fi

  extras:
    name: adapters, runtime, example
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install numpy safetensors transformers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: safetensors adapter
        run: python -m unittest discover -s tests -p "test_safetensors_store.py" -v
      - name: runtime and evaluation
        run: python -m unittest discover -s tests -p "test_runtime_hf.py" -v
      - name: end-to-end example
        run: python examples/tiny_edit.py
