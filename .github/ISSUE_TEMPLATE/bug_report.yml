name: Bug report
description: Something is wrong, or a guarantee does not hold.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please include the smallest reproduction you can. If a checkpoint is
        involved, name the model and its pinned revision.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behaviour, including the full traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, a spec, or a few lines of Python.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -m machaon.cli --version` and your Python version.
    validations:
      required: true
