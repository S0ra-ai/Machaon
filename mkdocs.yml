            Work with OpenWSP: OpenWSP を使う
            Qwen3.6-27B: Qwen3.6-27B
            Reference: リファレンス
            Python API: Python API
            CLI: CLI
            Web console: Web コンソール
            Benchmarks: ベンチマーク
            MCP server: MCP サーバー
            Project: プロジェクト
            How Machaon fits: Machaon の位置づけ
