site_name: Machaon
site_description: Direct weight surgery for LLMs, with transactional verification.
site_url: https://s0ra-ai.github.io/Machaon/
repo_url: https://github.com/S0ra-ai/Machaon
repo_name: S0ra-ai/Machaon
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Getting started: 入门
            Installation: 安装
            Quickstart: 快速开始
            Concepts: 核心概念
            Weight editing: 权重编辑
            Null-space projection: 零空间投影
            Transactions and gates: 事务与验收门
            Guides: 指南
            Edit a fact: 编辑一个事实
            Evaluate an edit: 评估一次编辑
            Save a checkpoint: 保存检查点
            Work with OpenWSP: 使用 OpenWSP
            Qwen3.6-27B: Qwen3.6-27B
            Reference: 参考
            Python API: Python API
            CLI: 命令行
            Web console: Web 控制台
            Benchmarks: 基准测试
            MCP server: MCP 服务
            Project: 项目
            How Machaon fits: Machaon 的定位
            Architecture: 架构
            The maths: 数学原理
            Results: 实测结果
            Related work: 相关工作
            Roadmap: 路线图
            FAQ: 常见问题
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Getting started: はじめに
