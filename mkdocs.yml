markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - Weight editing: concepts/weight-editing.md
      - Null-space projection: concepts/null-space.md
      - Transactions and gates: concepts/transactions-and-gates.md
  - Guides:
      - Edit a fact: guides/edit-a-fact.md
      - Evaluate an edit: guides/evaluate.md
      - Save a checkpoint: guides/checkpoints.md
      - Work with OpenWSP: guides/openwsp-interop.md
      - Qwen3.6-27B: guides/qwen27b.md
  - Reference:
      - Python API: reference/api.md
      - CLI: reference/cli.md
      - Web console: reference/web.md
      - Benchmarks: reference/benchmarks.md
      - MCP server: reference/mcp.md
  - Project:
      - How Machaon fits: comparison.md
      - Architecture: ARCHITECTURE.md
      - The maths: MATH.md
      - Results: RESULTS.md
      - Related work: RELATED_WORK.md
      - Roadmap: roadmap.md
      - FAQ: faq.md
