[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machaon"
version = "0.4.2"
description = "Direct weight surgery for LLMs — edit weights, not gradients."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Machaon contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["model-editing", "weight-editing", "knowledge-editing", "llm", "interpretability"]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/S0ra-ai/Machaon"
Repository = "https://github.com/S0ra-ai/Machaon"
Documentation = "https://s0ra-ai.github.io/Machaon/"
Issues = "https://github.com/S0ra-ai/Machaon/issues"
Changelog = "https://github.com/S0ra-ai/Machaon/blob/main/CHANGELOG.md"
Discussions = "https://github.com/S0ra-ai/Machaon/discussions"

[project.optional-dependencies]
torch = ["torch>=2.0"]
hf = ["torch>=2.0", "transformers>=4.40", "safetensors>=0.4"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pre-commit>=3.5",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "uvicorn>=0.30",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "mkdocs-static-i18n>=1.2,<2",
]
bench = ["pyarrow>=14"]
mcp = ["mcp>=1.0; python_version >= '3.10'"]
all = [
  "torch>=2.0",
  "transformers>=4.40",
  "safetensors>=0.4",
  "pyarrow>=14",
  "fastapi>=0.115",
  "mcp>=1.0; python_version >= '3.10'",
  "uvicorn>=0.30",
]

[project.scripts]
machaon = "machaon.cli:main"
machaon-mcp = "machaon.mcp_server:main"
machaon-web = "machaon.web.app:main"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.hatch.build.targets.wheel]
packages = ["machaon"]

[tool.hatch.build.targets.sdist]
include = [
  "/machaon",
  "/tests",
  "/docs",
  "/examples",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/mkdocs.yml",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["machaon"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 78
show_missing = true
skip_covered = true
