[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machaon"
version = "0.0.1"
description = "Direct weight surgery for LLMs — edit weights, not gradients."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Machaon contributors" }]
keywords = ["model-editing", "weight-editing", "knowledge-editing", "llm", "interpretability"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
hf = ["torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=7"]

[project.scripts]
machaon = "machaon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["machaon"]
