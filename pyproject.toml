[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machaon"
version = "0.1.0"
description = "Direct weight surgery for LLMs — edit weights, not gradients."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Machaon contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/S0ra-ai/Machaon"
Issues = "https://github.com/S0ra-ai/Machaon/issues"
Changelog = "https://github.com/S0ra-ai/Machaon/blob/main/CHANGELOG.md"
keywords = ["model-editing", "weight-editing", "knowledge-editing", "llm", "interpretability"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
hf = ["torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=7"]
docs = ["mkdocs-material>=9.5,<10"]
bench = ["pyarrow>=14"]
mcp = ["mcp>=1.0"]

[project.scripts]
machaon = "machaon.cli:main"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.hatch.build.targets.wheel]
packages = ["machaon"]
